apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: leobet
  region: ap-southeast-1
  version: "1.27"
  tags:
    karpenter.sh/discovery: leobet

vpc:
  subnets:
    private:
      leobet-subnet-private1a:
        id: "subnet-01ac70cff12cdf323"
      leobet-subnet-private1b:
        id: "subnet-014aa2ac18cc23f0e"
      leobet-subnet-private1c:
        id: "subnet-05c56b62bbd303d96"

iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: karpenter
      namespace: karpenter
    roleName: leobet-karpenter
    attachPolicyARNs:
    - arn:aws:iam::420163908753:policy/KarpenterControllerPolicy-leobet
    roleOnly: true

iamIdentityMappings:
- arn: "arn:aws:iam::420163908753:role/KarpenterNodeRole-leobet"
  username: system:node:{{EC2PrivateDNSName}}
  groups:
  - system:bootstrappers
  - system:nodes

managedNodeGroups:
- instanceType: t3.medium
  amiFamily: AmazonLinux2
  name: leobet
  desiredCapacity: 3
  minSize: 3
  maxSize: 5