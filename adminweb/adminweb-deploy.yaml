apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminweb-deployment
  labels:
    app: adminweb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adminweb
  template:
    metadata:
      labels:
        app: adminweb
    spec:
      containers:
      - name: adminweb
        image: harbor.ailabpte.co/frontend/adminweb:0bbabab
        ports:
        - containerPort: 5071
        volumeMounts:
        - name: admin-conf-volume
          mountPath: /etc/nginx/conf.d
        - name: api-conf-volume
          mountPath: /etc/nginx/api
      volumes:
      - name: admin-conf-volume
        configMap:
          name: cm-adminweb
          items:
          - key: key-adminconf
            path: admin.conf
      - name: api-conf-volume
        configMap:
          name: cm-adminweb
          items:
          - key: key-apiadminconf
            path: ApiAdmin.conf
      imagePullSecrets:
      - name: regcred