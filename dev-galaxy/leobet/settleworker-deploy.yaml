apiVersion: apps/v1
kind: Deployment
metadata:
  name: settleworker-deployment
  namespace: leobet
  labels:
    app: settleworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settleworker
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: settleworker
    spec:
      containers:
        - name: settleworker
          image: harbor.ailabpte.co/integratedservice/thirdpartysettleworker:82ff488
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: seamlesswallet-configmap
                  key: environment
            - name: ServiceType
              value: Worker
          volumeMounts:
            - name: settleworker-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
      volumes:
        - name: settleworker-appsettings
          configMap:
            name: seamlesswallet-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
