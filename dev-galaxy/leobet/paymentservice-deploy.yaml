apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice-deployment
  namespace: leobet
  labels:
    app: paymentservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: harbor.ailabpte.co/paymentservice/paymentservice:afddcd6
          ports:
            - containerPort: 59159
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: paymentservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: paymentservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 59159
      volumes:
        - name: paymentservice-appsettings
          configMap:
            name: paymentservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
