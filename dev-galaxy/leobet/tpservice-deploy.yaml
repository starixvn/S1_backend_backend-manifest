apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-deployment
  namespace: leobet
  labels:
    app: tpservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tpservice
    spec:
      containers:
        - name: tpservice
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:a5e416a
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tpservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: tpservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
      volumes:
        - name: tpservice-appsettings
          configMap:
            name: tpservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
