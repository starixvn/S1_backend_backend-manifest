apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seamlesswallet-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-sw-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:420163908753:certificate/65761715-9f8a-4ca5-a586-ac68e7d42f74'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:420163908753:regional/webacl/TP_AccessRule/5e69029b-3b19-4d5e-b4f2-680e716e3e0b
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: "tp.aiking88dev.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443