apiVersion: apps/v1
kind: Deployment
metadata:
  name: storeservice-deployment
  namespace: leobet
  labels:
    app: storeservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storeservice
  template:
    metadata:
      labels:
        app: storeservice
    spec:
      containers:
        - name: storeservice
          image: harbor.ailabpte.co/storeservice/storeservice:42a1923
          ports:
            - containerPort: 51001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: storeservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: storeservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 51001
      volumes:
        - name: storeservice-appsettings
          configMap:
            name: storeservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
