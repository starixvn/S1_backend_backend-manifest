apiVersion: v1
kind: ConfigMap
metadata:
  name: hangfireservice-configmap
  namespace: leobet
data:
  environment: Development
  appsettings.Development: |
    {
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog"
            }
          }
        ]
      },
      "ElasticApm": {
        "ServiceName": "HangfireService",
        "ServiceVersion": "v1.0",
        "Environment": "Development",
        "LogLevel": "Info",
        "ServerUrl": "https://apm.ailabpte.co",
        "TransactionIgnoreUrls": "/health",
        "TransactionSampleRate": 1.0,
        "MaxBatchEventCount": 10
      },
      "ConnectionStrings": {
        "Worker_MainDB": "server=172.31.70.138;port=3306;user=worker_hangfire;database=Siebog;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;",
        "Worker_ReportDB": "server=172.31.70.138;port=3306;user=worker_hangfire;database=Siebog;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;",
        "Worker_WagerDB": "server=172.31.70.138;port=3306;user=worker_hangfire;database=BetDetail;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;",
        "Worker_LogDB": "server=172.31.70.138;port=3306;user=worker_hangfire;database=LogDB;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;",
        "Worker_IPTable": "server=172.31.70.138;port=3306;user=worker_hangfire;database=IPTable;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;",
        "Worker_ReportIPTable": "server=172.31.70.138;port=3306;user=worker_hangfire;database=IPTable;password=worker_hangfire;SslMode=None;AllowPublicKeyRetrieval=true;"
      },
      "RedisConnection": "172.31.71.175:6379,172.31.72.137:6379,password=Aa12345678!,ssl=false,syncTimeout=6000",
      "TelegramNotify": 1, // 1: enable 2: disable
      "AiLabServiceHost": {
        "CommonServiceHost": "http://commonservice-service",
        "TpService": "http://tpservice-service",
      },
      "LetsTalkConfig": {
        "SNS": {
          "LetsTalkGroupName": "SMSNotification"
        },
        "Monitoring": {
          "LetsTalkGroupName": "MonitoringNotification"
        }
      }
    }
