apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminsite-deployment
  namespace: leobet
  labels:
    app: adminsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminsite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: adminsite
      annotations:
        prometheus.io/port: '5070'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: adminsite
          image: harbor.ailabpte.co/adminsite/backendsite:3e03125
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: adminsite-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: adminsite-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
      volumes:
        - name: adminsite-appsettings
          configMap:
            name: adminsite-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
