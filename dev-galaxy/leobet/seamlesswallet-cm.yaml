        "API_LogDB": "server=172.31.70.138;port=3306;user=api_seamless;database=LogDB;password=api_seamless;SslMode=None;AllowPublicKeyRetrieval=true;",
        "API_IPTable": "server=172.31.70.138;port=3306;user=api_seamless;database=IPTable;password=api_seamless;SslMode=None;AllowPublicKeyRetrieval=true;",
        "API_ReportIPTable": "server=172.31.70.138;port=3306;user=api_seamless;database=IPTable;password=api_seamless;SslMode=None;AllowPublicKeyRetrieval=true;",
