apiVersion: v1
kind: ConfigMap
metadata:
  name: seamlesswallet-configmap
  namespace: leobet
data:
  environment: Development
  appsettings.Development: |
    {
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog"
            }
          }
        ]
      },
      "ElasticApm": {
        "ServiceName": "SeamlessWallet",
        "ServiceVersion": "v1.0",
        "Environment": "Development",
        "LogLevel": "Info",
        "ServerUrl": "https://apm.ailabpte.co",
        "TransactionIgnoreUrls": "/health",
        "TransactionSampleRate": 1.0,
        "MaxBatchEventCount": 10
      },
      "ConnectionStrings": {
        "API_MainDB": "server=172.31.70.138;port=3306;user=api_seamless;database=Siebog;password=api_seamless;SslMode=None;AllowPublicKeyRetrieval=true;",
