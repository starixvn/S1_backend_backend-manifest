apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-deployment
  namespace: leobet
  labels:
    app: membersite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: membersite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite
      annotations:
        prometheus.io/port: '80'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: membersite
          image: harbor.ailabpte.co/membersite/membersite:db3203b
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: membersite-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: membersite-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
      volumes:
        - name: membersite-appsettings
          configMap:
            name: membersite-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
