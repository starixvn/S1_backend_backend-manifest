apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminsite-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-admin-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:420163908753:certificate/65761715-9f8a-4ca5-a586-ac68e7d42f74'
    alb.ingress.kubernetes.io/security-groups: ailab-https-sg
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: "api.aiking88dev.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: adminsite-service
              port:
                number: 443