apiVersion: apps/v1
kind: Deployment
metadata:
  name: storehangfireservice-deployment
  namespace: leobet
  labels:
    app: storehangfireservice
spec:
  replicas: 0
  selector:
    matchLabels:
      app: storehangfireservice
  template:
    metadata:
      labels:
        app: storehangfireservice
    spec:
      containers:
        - name: storehangfireservice
          image: harbor.ailabpte.co/storeservice/storehangfireservice:240f7ba
          ports:
            - containerPort: 51003
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: storeservice-configmap
                  key: environment
            - name: Worker
              value: API
          volumeMounts:
            - name: storehangfireservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 51003
      volumes:
        - name: storehangfireservice-appsettings
          configMap:
            name: storeservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: ailab
