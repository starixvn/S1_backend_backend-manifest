apiVersion: apps/v1
kind: Deployment
metadata:
  name: backendsite-deployment
  namespace: nova88
  labels:
    app: backendsite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backendsite
  template:
    metadata:
      labels:
        app: backendsite
    spec:
      containers:
      - name: backendsite-dev
        image: harbor.ailabpte.co/adminsite/backendsite:057b547
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: backendsite-configmap
              key: environment
        volumeMounts:
        - name: backendsite-appsettings
          mountPath: /app/appsettings.Development.json
          subPath: appsettings.Development.json
        livenessProbe:
          httpGet:
            path: /health
            port: 80
      volumes:
      - name: backendsite-appsettings
        configMap:
          name: backendsite-configmap
          items:
          - key: appsettings.Development
            path: appsettings.Development.json
      imagePullSecrets:
      - name: regcred