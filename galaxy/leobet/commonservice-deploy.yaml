apiVersion: apps/v1
kind: Deployment
metadata:
  name: commonservice-deployment
  namespace: leobet
  labels:
    app: commonservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commonservice
  template:
    metadata:
      labels:
        app: commonservice
    spec:
      containers:
        - name: commonservice
          image: harbor.ailabpte.co/integratedservice/commonservice:5288676
          ports:
            - containerPort: 59359
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: commonservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: commonservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
          livenessProbe:
            httpGet:
              path: /health
              port: 59359
      volumes:
        - name: commonservice-appsettings
          configMap:
            name: commonservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
      imagePullSecrets:
        - name: ailab
