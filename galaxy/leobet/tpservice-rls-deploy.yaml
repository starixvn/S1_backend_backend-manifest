apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-rls-deployment
  namespace: leobet
  labels:
    app: tpservice-rls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpservice-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tpservice-rls
    spec:
      containers:
        - name: tpservice-rls
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:a74f3d9
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
          volumeMounts:
            - name: tpservice-appsettings
              mountPath: /app/appsettings.Release.json
              subPath: appsettings.Production.json
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
      volumes:
        - name: tpservice-appsettings
          configMap:
            name: tpservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
      imagePullSecrets:
        - name: ailab
