apiVersion: apps/v1
kind: Deployment
metadata:
  name: seamlesswallet-deployment
  namespace: leobet
  labels:
    app: seamlesswallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seamlesswallet
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: seamlesswallet
    spec:
      containers:
        - name: seamlesswallet
          image: harbor.ailabpte.co/integratedservice/thirdpartyseamlesswallet:8596bc7
          ports:
            - containerPort: 59259
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: seamlesswallet-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: seamlesswallet-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
          livenessProbe:
            httpGet:
              path: /health
              port: 59259
      terminationGracePeriodSeconds: 30
      volumes:
        - name: seamlesswallet-appsettings
          configMap:
            name: seamlesswallet-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
      imagePullSecrets:
        - name: ailab
