apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminsite-rls-deployment
  namespace: leobet
  labels:
    app: adminsite-rls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminsite-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: adminsite-rls
    spec:
      containers:
        - name: adminsite-rls
          image: harbor.ailabpte.co/adminsite/backendsite:416a1cc
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
          volumeMounts:
            - name: adminsite-appsettings
              mountPath: /app/appsettings.Release.json
              subPath: appsettings.Production.json
      volumes:
        - name: adminsite-appsettings
          configMap:
            name: adminsite-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
      imagePullSecrets:
        - name: ailab
