apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paymentservice-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: leobet-payment-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:420163908753:certificate/ba18ad3e-02b8-4a44-a2cb-90fd6700a95a'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:420163908753:regional/webacl/Payment_AccessRule_PRD/db6baa54-4f1a-4490-9b42-db418365ee4b
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: "payment.aiking88.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: payservice-service
              port:
                number: 443