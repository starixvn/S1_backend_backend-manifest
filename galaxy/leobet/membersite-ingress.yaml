apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: membersite-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: leobet-hangfire-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/group.name: leobet-hangfire-group
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: "api.aiking88dev.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: membersite-service
              port:
                number: 80