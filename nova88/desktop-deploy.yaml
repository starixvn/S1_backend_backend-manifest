apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova88-deployment
  namespace: nova88
  labels:
    app: nova88
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova88
  template:
    metadata:
      labels:
        app: nova88
    spec:
      containers:
      - name: nova88
        image: harbor.ailabpte.co/desktop/next-sample-dev:e90aedc
        ports:
        - containerPort: 5081
      imagePullSecrets:
      - name: ailab