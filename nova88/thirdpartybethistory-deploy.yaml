apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdpartybethistory-deployment
  namespace: nova88
  labels:
    app: thirdpartybethistory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdpartybethistory
  template:
    metadata:
      labels:
        app: thirdpartybethistory
    spec:
      containers:
      - name: thirdpartybethistory
        image: harbor.ailabpte.co/integratedservice/thirdpartybethistory:f9f31cf
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: thirdpartybethistory-configmap
              key: environment
        - name: ServiceType
          value: Worker
        volumeMounts:
        - name: thirdpartybethistory-appsettings
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
      volumes:
      - name: thirdpartybethistory-appsettings
        configMap:
          name: thirdpartybethistory-configmap
          items:
          - key: appsettings.Production
            path: appsettings.Production.json
      imagePullSecrets:
      - name: ailab