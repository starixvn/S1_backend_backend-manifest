apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonusservice-deployment
  namespace: nova88
  labels:
    app: bonusservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonusservice
  template:
    metadata:
      labels:
        app: bonusservice
    spec:
      containers:
      - name: bonusservice
        image: harbor.ailabpte.co/bonusservice/bonusservice:057d3f5
        ports:
        - containerPort: 50997
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: bonusservice-configmap
              key: environment
        volumeMounts:
        - name: bonusservice-appsettings
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        livenessProbe:
          httpGet:
            path: /health
            port: 50997
      volumes:
      - name: bonusservice-appsettings
        configMap:
          name: bonusservice-configmap
          items:
          - key: appsettings.Production
            path: appsettings.Production.json
      imagePullSecrets:
      - name: ailab